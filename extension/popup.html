<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h2>Report Bug</h2>
      <div class="header-actions">
        <button id="settings-btn" class="icon-btn" title="Settings">&#9881;</button>
        <button id="close-btn" class="icon-btn" title="Close">&times;</button>
      </div>
    </header>

    <!-- Settings panel. Shown on demand, and automatically on first run when no
         server URL has been configured yet. -->
    <section id="settings-panel" class="settings-panel hidden">
      <div class="form-group">
        <label for="server-url">Moth70 server URL *</label>
        <input type="url" id="server-url" placeholder="http://localhost:3000" />
        <p class="field-hint">Where reports are submitted. No trailing slash needed.</p>
      </div>
      <div class="form-group">
        <label for="reporter-name">Your name</label>
        <input type="text" id="reporter-name" placeholder="Optional" />
      </div>
      <div class="form-group">
        <label for="reporter-email">Your email</label>
        <input type="email" id="reporter-email" placeholder="Optional" />
      </div>
      <p id="settings-status" class="settings-status"></p>
      <div class="settings-actions">
        <button type="button" id="test-connection-btn">Test connection</button>
        <button type="button" id="save-settings-btn">Save</button>
      </div>
    </section>

    <!-- Everything below is hidden while the settings panel is open. -->
    <div id="main-view">
    
    <div id="screenshot-preview-container">
      <img id="screenshot-preview" src="" alt="Screenshot preview" />
      <div id="screenshot-loading">Capturing screen...</div>
    </div>

    <p id="diagnostics-note" class="diagnostics-note">Checking for console/network errors…</p>

    <div id="recording-controls" class="recording-controls">
      <span id="recording-status" class="recording-status">Session recording off</span>
      <button type="button" id="recording-toggle">Start Recording</button>
    </div>

    <form id="bug-form">
      <div class="form-group">
        <label for="title">Title *</label>
        <input type="text" id="title" required placeholder="What went wrong?" />
      </div>

      <div class="form-group">
        <label for="description">Description *</label>
        <textarea id="description" required placeholder="Provide details on how to reproduce the issue..."></textarea>
      </div>

      <div class="form-group">
        <label for="severity">Severity</label>
        <select id="severity">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
          <option value="critical">Critical</option>
        </select>
      </div>

      <button type="submit" id="submit-btn">Submit Report</button>
    </form>
    
    <div id="success-message" class="hidden">
      <div class="check-icon">✓</div>
      <h3>Report Submitted</h3>
      <p>Thank you for your feedback!</p>
      <a id="view-report-link" class="view-report-link hidden" target="_blank" rel="noreferrer">View report &rarr;</a>
    </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
